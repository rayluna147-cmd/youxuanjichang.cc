name: CI & SEO Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: 'npm'
      - run: npm ci
      - run: npm run check
      - run: npm run validate
      - run: npm run build
      - run: npm run seo:audit
      - run: npm run indexnow:dry
